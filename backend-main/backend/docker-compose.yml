services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: biotracer
      MARIADB_USER: biotracer
      MARIADB_PASSWORD: biotracer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - biotracer-mariadb:/var/lib/mysql

volumes:
  biotracer-mariadb:
